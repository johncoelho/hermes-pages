    --orange: #ff6b6b;

  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    min-height:100vh;
    overflow-x:hidden;
  }
  /* Canvas particles background */
  #particles-canvas {
    position:fixed; top:0; left:0;
    width:100%; height:100%;
    z-index:0;
    pointer-events:none;
  }
  /* Header */
  header {
    position:sticky; top:0; z-index:10;
    background: rgba(10,10,15,0.85);
    backdrop-filter:blur(16px);
    border-bottom:1px solid var(--border);
    padding:16px 24px;
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:12px;
  }
  header h1 {
    font-size:20px; font-weight:600;
    background:linear-gradient(135deg, var(--accent), var(--purple));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  header .meta {
    display:flex; align-items:center; gap:16px;
    font-size:13px; color:var(--text-dim);
  }
  header .meta span { display:flex; align-items:center; gap:6px; }
  header .badge {
    background:var(--accent-glow); color:var(--accent);
    padding:4px 12px; border-radius:999px;
    font-size:12px; font-weight:500;
    border:1px solid rgba(108,92,231,0.3);
  }
  .nav-days {
    display:flex; gap:6px; overflow-x:auto;
    padding:12px 24px; position:sticky; top:73px; z-index:9;
    background:rgba(10,10,15,0.7); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
    scrollbar-width:none;
  }
  .nav-days::-webkit-scrollbar { display:none; }
  .nav-days a {
    flex-shrink:0;
    padding:6px 14px; border-radius:8px;
    font-size:12px; font-weight:500;
    color:var(--text-dim); text-decoration:none;
    border:1px solid var(--border);
    transition:all .2s;
  }
  .nav-days a:hover, .nav-days a.active {
    background:var(--accent-glow);
    border-color:var(--accent);
    color:var(--accent);
  }
  .nav-days a.today {
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  main {
    max-width:800px; margin:0 auto;
    padding:24px; position:relative; z-index:1;
  }
  .day-section {
    margin-bottom:32px;
    opacity:0; transform:translateY(20px);
    animation:fadeIn .5s ease forwards;
  }
  @keyframes fadeIn { to { opacity:1; transform:translateY(0); } }
  .day-header {
    display:flex; align-items:center; gap:12px;
    margin-bottom:12px;
  }
  .day-header h2 {
    font-size:16px; font-weight:600;
  }
  .day-header .date-badge {
    font-size:11px; font-weight:500;
    padding:2px 10px; border-radius:999px;
    background:var(--surface); color:var(--text-dim);
    border:1px solid var(--border);
  }
  .day-header .day-count {
    font-size:12px; color:var(--text-dim);
    margin-left:auto;
  }
  .day-card {
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    transition:all .2s;
  }
  .day-card:hover { border-color:rgba(108,92,231,0.3); }
  .event-row {
    display:flex; align-items:center; gap:12px;
    padding:10px 16px;
    border-bottom:1px solid rgba(42,42,62,0.5);
    transition:background .15s;
    cursor:default;
  }
  .event-row:last-child { border-bottom:none; }
  .event-row:hover { background:rgba(108,92,231,0.05); }
  .event-time {
    font-family:'JetBrains Mono', monospace;
    font-size:13px; font-weight:500;
    min-width:85px; color:var(--accent);
    flex-shrink:0;
  }
  .event-time.allday {
    color:var(--green);
    font-size:11px;
  }
  .event-dot {
    width:6px; height:6px; border-radius:50%;
    flex-shrink:0;
    background:var(--accent);
  }
  .event-dot.allday { background:var(--green); }
  .event-title {
    font-size:14px; font-weight:400;
    flex:1;
  }
  .event-title strong { font-weight:600; }
  .today-marker {
    border-left:3px solid var(--today);
  }
  .today-marker .event-time { color:var(--today); }
  .empty-state {
    text-align:center; padding:60px 24px;
    color:var(--text-dim);
  }
  .empty-state svg { width:64px; height:64px; margin-bottom:16px; opacity:.4; }
  .empty-state p { font-size:15px; }
  footer {
    text-align:center; padding:32px 24px;
    font-size:12px; color:var(--text-dim);
    border-top:1px solid var(--border);
    position:relative; z-index:1;
  }
  @media(max-width:640px) {
    header { padding:12px 16px; }
    header h1 { font-size:17px; }
    .nav-days { padding:8px 16px; top:65px; }
    main { padding:16px; }
    .event-row { padding:8px 12px; }
    .event-time { min-width:70px; font-size:12px; }
    .event-title { font-size:13px; }
  }

// ─── Particle Canvas ───
const canvas = document.getElementById('particles-canvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W=canvas.width=window.innerWidth;
  H=canvas.height=window.innerHeight;
}
resize(); window.addEventListener('resize', resize);

const particles = Array.from({length:70}, () => ({
  x:Math.random()*W, y:Math.random()*H,
  vx:(Math.random()-0.5)*0.5, vy:(Math.random()-0.5)*0.5,
  r:Math.random()*1.5+0.5
}));

let mx=-1e9, my=-1e9;
document.addEventListener('mousemove', e => { mx=e.clientX; my=e.clientY; });

function drawParticles() {
  ctx.clearRect(0,0,W,H);
  for(const p of particles) {
    p.x+=p.vx; p.y+=p.vy;
    if(p.x<0||p.x>W) p.vx*=-1;
    if(p.y<0||p.y>H) p.vy*=-1;
    const dx=mx-p.x, dy=my-p.y, dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<140) {
      p.x-=dx*0.02; p.y-=dy*0.02;
    }
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle='rgba(108,92,231,0.3)';
    ctx.fill();
  }
  for(let i=0; i<particles.length; i++) {
    for(let j=i+1; j<particles.length; j++) {
      const dx=particles[i].x-particles[j].x;
      const dy=particles[i].y-particles[j].y;
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<140) {
        ctx.beginPath();
        ctx.moveTo(particles[i].x,particles[i].y);
        ctx.lineTo(particles[j].x,particles[j].y);
        ctx.strokeStyle=`rgba(108,92,231,${0.12*(1-dist/140)})`;
        ctx.lineWidth=0.5;
        ctx.stroke();
      }
    }
  }
  requestAnimationFrame(drawParticles);
}
drawParticles();

// ─── Render ───
const DAY_NAMES = {'Mon':'Seg','Tue':'Ter','Wed':'Qua','Thu':'Qui','Fri':'Sex','Sat':'Sáb','Sun':'Dom'};

function render() {
  const container = document.getElementById('days-container');
  const nav = document.getElementById('day-nav');
  const todayStr = '2026-06-08';
  let html = '';
  let navHtml = '';

  DAYS.forEach((day, idx) => {
    const isToday = day.date === todayStr;
    const shortLabel = day.label.replace(/\([^)]+\)/, m => '('+(DAY_NAMES[m.slice(1,-1)]||m.slice(1,-1))+')');

    navHtml += `<a href="#day-${idx}" class="${isToday?'today':''}" data-idx="${idx}">${shortLabel}</a>`;

    html += `<section class="day-section" id="day-${idx}">
      <div class="day-header">
        <h2>${shortLabel}</h2>
        <span class="date-badge">${isToday?'📌 Hoje':''}</span>
        <span class="day-count">${day.events.length} eventos</span>
      </div>
      <div class="day-card${isToday?' today-marker':''}">
        ${day.events.map(ev => `
          <div class="event-row">
            <span class="event-time ${ev.type==='allday'?'allday':''}">${ev.time}</span>
            <span class="event-dot ${ev.type==='allday'?'allday':''}"></span>
            <span class="event-title">${ev.summary}</span>
          </div>
        `).join('')}
      </div>
    </section>`;
  });

  if(!DAYS.length) {
    html = `<div class="empty-state">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
      <p>Nenhum compromisso nos próximos 30 dias</p>
    </div>`;
  }

  container.innerHTML = html;
  nav.innerHTML = navHtml;

  // IntersectionObserver for scroll-based active nav
  const sections = document.querySelectorAll('.day-section');
  const navLinks = nav.querySelectorAll('a');
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if(entry.isIntersecting) {
        navLinks.forEach(a => a.classList.remove('active'));
        const idx = entry.target.id.replace('day-','');
        navLinks.forEach(a => { if(a.dataset.idx===idx) a.classList.add('active'); });
      }
    });
  }, { threshold:0.08 });
  sections.forEach(s => observer.observe(s));
}

// ─── Inject data & render ───
document.addEventListener('DOMContentLoaded', render);
</script>
